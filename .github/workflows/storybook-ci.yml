name: Verify Rollapp Storybook

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rollapp-storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storybook:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify shadcn and build Storybook
        run: |
          npm run test:ui
          npm run build-storybook
          node scripts/storybook-release.mjs prepare storybook-static "$GITHUB_SHA"
      - name: Verify the complete published catalog locally
        env:
          ROLLAPP_STORYBOOK_URL: http://127.0.0.1:6198/
          ROLLAPP_STORYBOOK_SCREENSHOTS: ${{ runner.temp }}/storybook-report/screens
          ROLLAPP_A11Y_REPORT: ${{ runner.temp }}/storybook-report/accessibility.json
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/storybook-report"
          mkdir -p "$report"
          python3 -m http.server 6198 --bind 127.0.0.1 --directory storybook-static > "$report/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 12 --retry-connrefused --retry-delay 1 --fail --silent --show-error "${ROLLAPP_STORYBOOK_URL}index.json" > /dev/null
          set +e
          npm run test:storybook 2>&1 | tee "$report/browser.log"
          browser_status=$?
          npm run test:storybook:a11y 2>&1 | tee "$report/accessibility.log"
          accessibility_status=$?
          set -e
          (( browser_status == 0 && accessibility_status == 0 ))
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-report-${{ github.sha }}
          path: ${{ runner.temp }}/storybook-report
      - name: Preserve the verified static build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-release-${{ github.sha }}
          path: storybook-static/
          if-no-files-found: error
