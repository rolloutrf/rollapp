name: Test and deploy to Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification:
        description: "Release verification (image scans without deploying)"
        type: choice
        options: [full, snippets, identity-reports, health, page-rails, ui-copy, gift-cards, profile, drawers, image, none]
        default: full

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'rollapp-production-deploy' || format('rollapp-ui-audit-{0}', github.ref) }}
  # A cancelled job can leave an asynchronous VM metadata update racing the
  # next deployment. Let each production rollout reach a terminal state.
  cancel-in-progress: false
  queue: max

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.verification != 'none' && inputs.verification != 'image'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install video encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install pinned blockchain receipt codec
        run: |
          python3 -m venv "$RUNNER_TEMP/rollapp-ots"
          "$RUNNER_TEMP/rollapp-ots/bin/pip" install -r server/requirements/opentimestamps.txt
          echo "ROLLAPP_OTS_PYTHON=$RUNNER_TEMP/rollapp-ots/bin/python" >> "$GITHUB_ENV"

      - name: Install WebKit for native time field checks
        run: npx playwright-core install --with-deps webkit
      - name: Complete UI audit
        shell: bash
        env:
          ROLLAPP_CHECK_OUTPUT: ${{ runner.temp }}/rollapp-comprehensive.json
        run: |
          set -euo pipefail
          npm run check:comprehensive 2>&1 | tee "${RUNNER_TEMP}/rollapp-comprehensive.log"
      - name: Preserve complete audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rollapp-comprehensive.json
            ${{ runner.temp }}/rollapp-comprehensive.log
            /tmp/rollapp-*-failure.png
            /tmp/rollapp-snippets/*.json
            /tmp/rollapp-snippets/*failure*.png

  build-and-scan:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.verification == 'image')
    runs-on: ubuntu-24.04
    # The last complete release took 155 minutes; coverage has grown since then.
    # Preserve every assertion and allow headroom for the full browser matrices.
    timeout-minutes: 240
    outputs:
      artifact-id: ${{ steps.upload-image.outputs.artifact-id }}
      image-id: ${{ steps.build-image.outputs.image-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install WebKit for native time field checks
        if: github.event_name != 'workflow_dispatch' || inputs.verification == 'full'
        run: npx playwright-core install --with-deps webkit

      - name: Install video encoder
        if: github.event_name != 'workflow_dispatch' || (inputs.verification != 'none' && inputs.verification != 'drawers' && inputs.verification != 'image')
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pinned blockchain receipt codec
        if: github.event_name != 'workflow_dispatch' || (inputs.verification != 'none' && inputs.verification != 'drawers' && inputs.verification != 'image')
        run: |
          python3 -m venv "$RUNNER_TEMP/rollapp-ots"
          "$RUNNER_TEMP/rollapp-ots/bin/pip" install -r server/requirements/opentimestamps.txt
          echo "ROLLAPP_OTS_PYTHON=$RUNNER_TEMP/rollapp-ots/bin/python" >> "$GITHUB_ENV"

      - name: Test and build
        if: github.event_name != 'workflow_dispatch' || inputs.verification == 'full'
        env:
          ROLLAPP_CHECK_OUTPUT: ${{ runner.temp }}/rollapp-comprehensive.json
        shell: bash
        run: |
          set -euo pipefail
          npm run check:comprehensive 2>&1 | tee "${RUNNER_TEMP}/rollapp-comprehensive.log"
          npm run test:profile 2>&1 | tee -a "${RUNNER_TEMP}/rollapp-comprehensive.log"

      - name: Preserve complete release verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rollapp-comprehensive.json
            ${{ runner.temp }}/rollapp-comprehensive.log

      - name: Verify targeted snippet release
        if: github.event_name == 'workflow_dispatch' && inputs.verification == 'snippets'
        run: npm run check:release:snippets

      - name: Verify targeted identity report release
        if: github.event_name == 'workflow_dispatch' && inputs.verification == 'identity-reports'
        run: npm run check:release:identity-reports

      - name: Verify targeted health release
        if: github.event_name == 'workflow_dispatch' && inputs.verification == 'health'
        run: npm run check:release:health

      - name: Verify targeted page rail release
        if: github.event_name == 'workflow_dispatch' && inputs.verification == 'page-rails'
        run: npm run check:release:page-rails

      - name: Verify targeted UI copy release
        if: github.event_name == 'workflow_dispatch' && inputs.verification == 'ui-copy'
        run: npm run check:release:ui-copy

      - name: Verify targeted gift card release
        if: github.event_name == 'workflow_dispatch' && inputs.verification == 'gift-cards'
        run: npm run check:release:gift-cards

      - name: Verify targeted profile release
        if: github.event_name == 'workflow_dispatch' && inputs.verification == 'profile'
        run: npm run check:release:profile

      - name: Verify targeted drawer release
        if: github.event_name == 'workflow_dispatch' && inputs.verification == 'drawers'
        run: |
          node --test scripts/deploy-vm-metadata.test.js server/database-startup.test.js
          npm run test:ui
          npm run test:controls

      - name: Record explicit deployment without tests
        if: github.event_name == 'workflow_dispatch' && inputs.verification == 'none'
        run: echo "Tests skipped by explicit user request; Docker build, Trivy, schema verify and exact-SHA health remain."

      - name: Build release image
        id: build-image
        run: |
          set -euo pipefail
          image="rollapp-release:${GITHUB_SHA}"
          docker build --pull --platform linux/amd64 --tag "$image" .
          docker image inspect --format 'image-id={{.Id}}' "$image" >> "$GITHUB_OUTPUT"
          docker save --output "$RUNNER_TEMP/rollapp-image.tar" "$image"

      - name: Install and run Trivy
        env:
          TRIVY_VERSION: '0.76.2'
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --output "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" trivy

          ./trivy image --scanners vuln --input rollapp-image.tar --timeout 10m \
            --severity HIGH,CRITICAL --exit-on-eol 1 --table-mode detailed --no-progress --skip-version-check
          ./trivy image --scanners vuln --input rollapp-image.tar --timeout 10m \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --table-mode detailed --no-progress --skip-version-check

      - name: Upload scanned image
        id: upload-image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rollapp-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollapp-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  deploy:
    if: github.ref == 'refs/heads/main' && inputs.verification != 'image'
    needs: build-and-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      YC_FOLDER_ID: b1gebpfrhvkd43r38q98
      YC_DEPLOY_SA_ID: ajea75b2e3r8kiigmice
      YC_RUNTIME_SA_ID: ajers2ngi708sf3i1t4g
      YC_REGISTRY_ID: crpvg7pqnbpjl26q93f6
      YC_VM_ID: fv4chl6pdb4lnhsj7139
      IMAGE_REPOSITORY: cr.yandex/crpvg7pqnbpjl26q93f6/rollapp
      PUBLIC_URL: https://xn--80avakiab.xn--p1ai

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install runtime dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Download scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-and-scan.outputs.artifact-id }}
          path: ${{ runner.temp }}
          digest-mismatch: error

      - name: Verify and tag scanned image
        env:
          EXPECTED_IMAGE_ID: ${{ needs.build-and-scan.outputs.image-id }}
          IMAGE_SHA: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          image="rollapp-release:${GITHUB_SHA}"
          docker load --input "$RUNNER_TEMP/rollapp-image.tar"
          actual_id="$(docker image inspect --format '{{.Id}}' "$image")"
          if [[ ! "$EXPECTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ || "$actual_id" != "$EXPECTED_IMAGE_ID" ]]; then
            echo '::error::Loaded image ID differs from the scanned image ID'
            exit 1
          fi
          docker tag "$actual_id" "$IMAGE_SHA"

      - name: Log in to Yandex Container Registry via OIDC
        uses: yc-actions/yc-cr-login@ee42362bcacb854964afa3a3180ca8ae6dd388f8 # v3.0.2
        with:
          yc-sa-id: ${{ env.YC_DEPLOY_SA_ID }}

      - name: Push scanned image
        env:
          IMAGE_SHA: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
        run: docker push "$IMAGE_SHA"

      - name: Exchange GitHub OIDC token for Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2Frolloutrf" \
            | jq -er '.value')"
          IAM_TOKEN="$(curl -fsS -X POST https://auth.yandex.cloud/oauth/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            | jq -er '.access_token')"
          echo "::add-mask::${IAM_TOKEN}"
          echo "YC_IAM_TOKEN=${IAM_TOKEN}" >> "$GITHUB_ENV"

      - name: Deploy image to production VM
        timeout-minutes: 4
        env:
          IMAGE_SHA: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          YANDEX_DISK_BACKUP_ENABLED: ${{ vars.YANDEX_DISK_BACKUP_ENABLED }}
          YC_YANDEX_DISK_OAUTH_LOCKBOX_SECRET_ID: ${{ vars.YC_YANDEX_DISK_OAUTH_LOCKBOX_SECRET_ID }}
          ROLLAPP_YANDEX_DISK_PROFILE_ENABLED: ${{ vars.ROLLAPP_YANDEX_DISK_PROFILE_ENABLED }}
        run: node scripts/deploy-vm-metadata.mjs

      - name: Verify production health
        env:
          YANDEX_DISK_BACKUP_ENABLED: ${{ vars.YANDEX_DISK_BACKUP_ENABLED }}
          YC_YANDEX_DISK_OAUTH_LOCKBOX_SECRET_ID: ${{ vars.YC_YANDEX_DISK_OAUTH_LOCKBOX_SECRET_ID }}
          ROLLAPP_YANDEX_DISK_PROFILE_ENABLED: ${{ vars.ROLLAPP_YANDEX_DISK_PROFILE_ENABLED }}
        run: |
          set -euo pipefail

          read_health() {
            curl -fsS --max-time 10 "${PUBLIC_URL}/api/healthz" 2>/dev/null || true
          }

          wait_for_expected_version() {
            local max_attempts="$1"
            local health actual_version
            for attempt in $(seq 1 "$max_attempts"); do
              health="$(read_health)"
              if jq -e --arg expected "$GITHUB_SHA" \
                '.ok == true and .service == "rollapp" and .version == $expected' \
                <<<"$health" >/dev/null 2>&1; then
                return 0
              fi
              actual_version="$(jq -r '.version // "unavailable"' <<<"$health" 2>/dev/null || echo unavailable)"
              echo "Waiting for production (${attempt}/${max_attempts}); current version: ${actual_version}"
              sleep 5
            done
            return 1
          }

          if ! wait_for_expected_version 24; then
            current_health="$(read_health)"
            if jq -e --arg expected "$GITHUB_SHA" \
              '.ok == true and .service == "rollapp" and (.version | type == "string") and .version != $expected' \
              <<<"$current_health" >/dev/null 2>&1; then
              stale_version="$(jq -r '.version' <<<"$current_health")"
              echo "Production is healthy but stale at ${stale_version}; keeping the running service available" >&2
              echo "Inspect COI pull errors and VM disk space before any manual restart; see docs/verification.md" >&2
              exit 1
            else
              echo "Production became unhealthy while deploying; refusing an automatic restart: ${current_health}" >&2
              exit 1
            fi
          fi

          echo "Rollapp is healthy at ${PUBLIC_URL} on ${GITHUB_SHA}"
          mcp_status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "${PUBLIC_URL}/mcp")"
          if [ "$mcp_status" != "401" ]; then
            echo "Unauthenticated MCP endpoint returned ${mcp_status}, expected 401" >&2
            exit 1
          fi
          if [ "$YANDEX_DISK_BACKUP_ENABLED" = "true" ]; then
            curl -fsS --max-time 10 "${PUBLIC_URL}/api/auth/yandex/config" |
              jq -e '.enabled == true and (.diskBackupEnabled == true or .diskSyncEnabled == true)' >/dev/null
          fi
          health="$(read_health)"
          if [ -n "$YC_YANDEX_DISK_OAUTH_LOCKBOX_SECRET_ID" ]; then
            jq -e '.capabilities.privateNotes == true' <<<"$health" >/dev/null
          fi
          if [ "$ROLLAPP_YANDEX_DISK_PROFILE_ENABLED" = "true" ]; then
            jq -e '.capabilities.diskProfile == true' <<<"$health" >/dev/null
          fi
          if ! jq -e '.capabilities.marketplaceAi == true' <<<"$health" >/dev/null 2>&1; then
            echo "::warning::Marketplace AI search is not configured; production will use direct catalogues only"
          fi
          for redirect_url in \
            "https://rollapp.130-193-58-26.sslip.io/api/healthz" \
            "https://www.xn--80avakiab.xn--p1ai/api/healthz"; do
            redirect_result="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code} %{redirect_url}' "$redirect_url")"
            if [ "$redirect_result" != "301 ${PUBLIC_URL}/api/healthz" ]; then
              echo "Unexpected canonical redirect for ${redirect_url}: ${redirect_result}" >&2
              exit 1
            fi
          done
          profile_key="$(node scripts/production-profile-key.mjs "${PUBLIC_URL}")"
          profile_status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "${PUBLIC_URL}/${profile_key}")"
          if [ "$profile_status" != "200" ]; then
            echo "Clean public profile returned ${profile_status}" >&2
            exit 1
          fi
          for legacy_path in "/u/${profile_key}" "/users/${profile_key}"; do
            redirect_result="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code} %{redirect_url}' "${PUBLIC_URL}${legacy_path}")"
            if [ "$redirect_result" != "301 ${PUBLIC_URL}/${profile_key}" ]; then
              echo "Unexpected profile redirect" >&2
              exit 1
            fi
          done

      - name: Configure Telegram Mini App
        env:
          YC_LOCKBOX_SOURCE: iam
          YC_TELEGRAM_LOCKBOX_SECRET_ID: e6qqi6inhrnvg67mkhhs
          TELEGRAM_BOT_USERNAME: rollappRFbot
          TELEGRAM_WEB_APP_URL: https://xn--80avakiab.xn--p1ai/
          TELEGRAM_DELIVERY_MODE: external-polling
          TELEGRAM_REQUIRE_MAIN_WEB_APP: "true"
        run: npm run telegram:configure
