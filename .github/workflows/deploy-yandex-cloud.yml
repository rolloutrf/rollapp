name: Test and deploy to Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification:
        description: "Release verification (snippets only when explicitly requested)"
        type: choice
        options: [full, snippets]
        default: full

permissions:
  contents: read
  id-token: write

concurrency:
  group: rollapp-production
  # A cancelled job can leave an asynchronous VM metadata update racing the
  # next deployment. Let each production rollout reach a terminal state.
  cancel-in-progress: false

env:
  YC_FOLDER_ID: b1gebpfrhvkd43r38q98
  YC_DEPLOY_SA_ID: ajea75b2e3r8kiigmice
  YC_RUNTIME_SA_ID: ajers2ngi708sf3i1t4g
  YC_REGISTRY_ID: crpvg7pqnbpjl26q93f6
  YC_VM_ID: fv4chl6pdb4lnhsj7139
  IMAGE_REPOSITORY: cr.yandex/crpvg7pqnbpjl26q93f6/rollapp
  PUBLIC_URL: https://xn--80avakiab.xn--p1ai

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install WebKit for native time field checks
        run: npx playwright-core install --with-deps webkit
      - name: Complete UI audit
        shell: bash
        env:
          ROLLAPP_CHECK_OUTPUT: ${{ runner.temp }}/rollapp-comprehensive.json
        run: |
          set -euo pipefail
          npm run check:comprehensive 2>&1 | tee "${RUNNER_TEMP}/rollapp-comprehensive.log"
      - name: Preserve complete audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rollapp-comprehensive.json
            ${{ runner.temp }}/rollapp-comprehensive.log
            /tmp/rollapp-*-failure.png
            /tmp/rollapp-snippets/*.json
            /tmp/rollapp-snippets/*failure*.png

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The last complete release took 117 minutes before adding snippet coverage.
    # Preserve every assertion and allow headroom for the full browser matrices.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install WebKit for native time field checks
        run: npx playwright-core install --with-deps webkit

      - name: Test and build
        if: github.event_name != 'workflow_dispatch' || inputs.verification != 'snippets'
        run: npm run check:release

      - name: Verify targeted snippet release
        if: github.event_name == 'workflow_dispatch' && inputs.verification == 'snippets'
        run: npm run check:release:snippets

      - name: Log in to Yandex Container Registry via OIDC
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-id: ${{ env.YC_DEPLOY_SA_ID }}

      - name: Build and push immutable image
        env:
          IMAGE_SHA: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --tag "$IMAGE_SHA" .
          docker push "$IMAGE_SHA"

      - name: Exchange GitHub OIDC token for Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2Frolloutrf" \
            | jq -er '.value')"
          IAM_TOKEN="$(curl -fsS -X POST https://auth.yandex.cloud/oauth/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            | jq -er '.access_token')"
          echo "::add-mask::${IAM_TOKEN}"
          echo "YC_IAM_TOKEN=${IAM_TOKEN}" >> "$GITHUB_ENV"

      - name: Deploy image to production VM
        timeout-minutes: 4
        env:
          IMAGE_SHA: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
        run: node scripts/deploy-vm-metadata.mjs

      - name: Verify production health
        run: |
          set -euo pipefail

          read_health() {
            curl -fsS --max-time 10 "${PUBLIC_URL}/api/healthz" 2>/dev/null || true
          }

          wait_for_expected_version() {
            local max_attempts="$1"
            local health actual_version
            for attempt in $(seq 1 "$max_attempts"); do
              health="$(read_health)"
              if jq -e --arg expected "$GITHUB_SHA" \
                '.ok == true and .version == $expected' \
                <<<"$health" >/dev/null 2>&1; then
                return 0
              fi
              actual_version="$(jq -r '.version // "unavailable"' <<<"$health" 2>/dev/null || echo unavailable)"
              echo "Waiting for production (${attempt}/${max_attempts}); current version: ${actual_version}"
              sleep 5
            done
            return 1
          }

          if ! wait_for_expected_version 24; then
            current_health="$(read_health)"
            if jq -e --arg expected "$GITHUB_SHA" \
              '.ok == true and .service == "rollapp" and (.version | type == "string") and .version != $expected' \
              <<<"$current_health" >/dev/null 2>&1; then
              stale_version="$(jq -r '.version' <<<"$current_health")"
              echo "Production is healthy but stale at ${stale_version}; keeping the running service available" >&2
              echo "Inspect COI pull errors and VM disk space before any manual restart; see docs/verification.md" >&2
              exit 1
            else
              echo "Production became unhealthy while deploying; refusing an automatic restart: ${current_health}" >&2
              exit 1
            fi
          fi

          echo "Rollapp is healthy at ${PUBLIC_URL} on ${GITHUB_SHA}"
          health="$(read_health)"
          if ! jq -e '.capabilities.marketplaceAi == true' <<<"$health" >/dev/null 2>&1; then
            echo "::warning::Marketplace AI search is not configured; production will use direct catalogues only"
          fi
          for redirect_url in \
            "https://rollapp.130-193-58-26.sslip.io/api/healthz" \
            "https://www.xn--80avakiab.xn--p1ai/api/healthz"; do
            redirect_result="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code} %{redirect_url}' "$redirect_url")"
            if [ "$redirect_result" != "301 ${PUBLIC_URL}/api/healthz" ]; then
              echo "Unexpected canonical redirect for ${redirect_url}: ${redirect_result}" >&2
              exit 1
            fi
          done
          profile_status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "${PUBLIC_URL}/koloskof")"
          if [ "$profile_status" != "200" ]; then
            echo "Clean public profile returned ${profile_status}" >&2
            exit 1
          fi
          for legacy_path in "/u/koloskof" "/users/koloskof"; do
            redirect_result="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code} %{redirect_url}' "${PUBLIC_URL}${legacy_path}")"
            if [ "$redirect_result" != "301 ${PUBLIC_URL}/koloskof" ]; then
              echo "Unexpected profile redirect for ${legacy_path}: ${redirect_result}" >&2
              exit 1
            fi
          done

      - name: Configure Telegram Mini App
        env:
          YC_LOCKBOX_SOURCE: iam
          YC_TELEGRAM_LOCKBOX_SECRET_ID: e6qqi6inhrnvg67mkhhs
          TELEGRAM_BOT_USERNAME: rollappRFbot
          TELEGRAM_WEB_APP_URL: https://xn--80avakiab.xn--p1ai/
          TELEGRAM_DELIVERY_MODE: external-polling
          TELEGRAM_REQUIRE_MAIN_WEB_APP: "true"
        run: npm run telegram:configure
