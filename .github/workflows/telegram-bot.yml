name: Run Telegram bot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rollapp-telegram-bot
  cancel-in-progress: false

env:
  YC_FOLDER_ID: b1gebpfrhvkd43r38q98
  YC_RUNTIME_SA_ID: ajea75b2e3r8kiigmice

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Exchange GitHub OIDC token for Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2Frolloutrf" \
            | jq -er '.value')"
          IAM_TOKEN="$(curl -fsS -X POST https://auth.yandex.cloud/oauth/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_RUNTIME_SA_ID}" \
            --data-urlencode "subject_token=${OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            | jq -er '.access_token')"
          echo "::add-mask::${IAM_TOKEN}"
          echo "YC_IAM_TOKEN=${IAM_TOKEN}" >> "$GITHUB_ENV"

      - name: Install pinned Yandex Cloud CLI
        run: |
          sudo curl -fsSL \
            https://storage.yandexcloud.net/yandexcloud-yc/release/0.201.0/linux/amd64/yc \
            -o /usr/local/bin/yc
          sudo chmod 0755 /usr/local/bin/yc

      - name: Poll Telegram updates
        env:
          YC_LOCKBOX_SOURCE: cli
          YC_TELEGRAM_LOCKBOX_SECRET_ID: e6qqi6inhrnvg67mkhhs
          YC_TELEGRAM_BOT_TOKEN_KEY: bot_token
          TELEGRAM_BOT_USERNAME: rollappRFbot
          TELEGRAM_WEB_APP_URL: https://xn--80avakiab.xn--p1ai/
          TELEGRAM_POLLING_RUN_SECONDS: "20400"
        run: node scripts/run-telegram-bot.mjs
